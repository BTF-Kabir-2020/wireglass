name: Feature request
description: Suggest a new measurement or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WIREGLASS favors **real measurements** over inferred ones. A feature that
        cannot be backed by a direct measurement is unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to learn that the tool cannot show today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the tool do, and what would the report show?
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: How would this be measured?
      description: What real signal would back this, and what should happen when it fails?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
