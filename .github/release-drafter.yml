name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🎯 زیرساخت / infra'
    labels: ['infra', 'dependencies']
  - title: '🐛 اشکالات برطرف‌شده'
    labels: ['bug', 'fix']
  - title: '✨ ویژگی‌های جدید'
    labels: ['feature', 'enhancement']
  - title: '📚 مستندات'
    labels: ['documentation', 'docs']
  - title: '🧪 تست‌ها'
    labels: ['testing', 'test']
  - title: '🧩 تغییرات داخلی'
    labels: ['refactor', 'chore']
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '`*_{}[]()#+-.!'
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement']
  patch:
    labels: ['patch', 'bug', 'fix', 'refactor', 'chore', 'documentation', 'dependencies']
  default: patch
template: |
  ## Changes

  $CHANGES

  ## Full commit log

  Full changelog: https://github.com/BTF-Kabir-2020/wireglass/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
